<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriTrack Demo Premium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Diseño: menú lateral violeta fijo + área de trabajo con tarjetas y tablas; paleta NUT-CMP-001,
     botones con colores de Bootstrap 5.3 y etiquetas de dietas con sus colores originales. */
  :root {
    --bg: #EEF0FA; --surface: #FFFFFF; --surface2: #E6E8F5; --line: #DCDFF0;
    --ink: #1F2340; --muted: #5E6384;
    --brand: #6C5DD3; --brand-hover: #5A4BC2; --brand-text: #5B4CC4; --brand-soft: #E8E5FB; --brand-soft-ink: #4A3BB0;
    --ok: #166534; --ok-soft: #E3F4EA; --err: #B91C1C; --err-soft: #FDECEC; --warn: #92400E; --warn-soft: #FEF3E2;
    /* Etiquetas del catálogo de dietas (colores originales) */
    --t-time: #4A7FCB; --t-time-bg: #DDEAF8; --t-cons: #2D6A4F; --t-cons-bg: #D8F3DC; --t-spec: #7B5EA7; --t-spec-bg: #EDE9F5;
    --t-deliv: #0F766E; --t-deliv-ink: #FFFFFF;
    --c-time: #3592FE; --c-time-ink: #F0EDE8; --c-cons: #F59E0B; --c-spec: #4ADF9C; --c-ink: #1A1714;
    /* Botones Bootstrap 5.3 */
    --b-primary: #0D6EFD; --b-primary-h: #0B5ED7; --b-secondary: #6C757D; --b-success: #198754; --b-success-h: #157347;
    --b-danger: #DC3545; --b-danger-h: #BB2D3B; --b-warning: #FFC107; --b-warning-h: #FFCA2C; --b-info: #0DCAF0; --b-info-h: #31D2F2;
    --b-light: #F8F9FA; --b-focus: rgba(13, 110, 253, .3);
    --shadow: 0 1px 3px rgba(31, 35, 64, .07), 0 4px 16px rgba(31, 35, 64, .05);
    --overlay: rgba(31, 35, 64, .55);
    --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --side-w: 248px;
    --bar-h: 34px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1B33; --surface: #28264A; --surface2: #322F5C; --line: #3A3766; --ink: #ECEBFA; --muted: #A9A7C9;
      --brand-text: #A79DF0; --brand-soft: #353163; --brand-soft-ink: #C9C2FA;
      --ok: #4ADE80; --ok-soft: #1E3A2B; --err: #F87171; --err-soft: #3A1A1F; --warn: #FBBF24; --warn-soft: #3A2E14;
      --t-time: #9EC1F0; --t-time-bg: #1E2F4A; --t-cons: #8FD6B0; --t-cons-bg: #18352A; --t-spec: #C9B3EE; --t-spec-bg: #30264A;
      --overlay: rgba(0, 0, 0, .6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1B33; --surface: #28264A; --surface2: #322F5C; --line: #3A3766; --ink: #ECEBFA; --muted: #A9A7C9;
    --brand-text: #A79DF0; --brand-soft: #353163; --brand-soft-ink: #C9C2FA;
    --ok: #4ADE80; --ok-soft: #1E3A2B; --err: #F87171; --err-soft: #3A1A1F; --warn: #FBBF24; --warn-soft: #3A2E14;
    --t-time: #9EC1F0; --t-time-bg: #1E2F4A; --t-cons: #8FD6B0; --t-cons-bg: #18352A; --t-spec: #C9B3EE; --t-spec-bg: #30264A;
    --overlay: rgba(0, 0, 0, .6); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
  a { color: var(--brand-text); }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--b-primary); outline-offset: 2px; }

  /* ── Botones (Bootstrap 5.3) ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12.5px; }
  .btn-primary { background: var(--b-primary); color: #fff; } .btn-primary:hover:not(:disabled) { background: var(--b-primary-h); }
  .btn-success { background: var(--b-success); color: #fff; } .btn-success:hover:not(:disabled) { background: var(--b-success-h); }
  .btn-danger { background: var(--b-danger); color: #fff; } .btn-danger:hover:not(:disabled) { background: var(--b-danger-h); }
  .btn-warning { background: var(--b-warning); color: #000; } .btn-warning:hover:not(:disabled) { background: var(--b-warning-h); }
  .btn-info { background: var(--b-info); color: #000; } .btn-info:hover:not(:disabled) { background: var(--b-info-h); }
  .btn-ghost { background: var(--surface); color: var(--b-secondary); border-color: var(--b-secondary); }
  .btn-ghost:hover:not(:disabled) { background: var(--b-secondary); color: #fff; }
  .btn-outline-primary { background: var(--surface); color: var(--b-primary); border-color: var(--b-primary); }
  .btn-outline-primary:hover:not(:disabled) { background: var(--b-primary); color: #fff; }
  .btn-outline-danger { background: var(--surface); color: var(--b-danger); border-color: var(--b-danger); }
  .btn-outline-danger:hover:not(:disabled) { background: var(--b-danger); color: #fff; }
  .btn-light-outline { background: transparent; color: var(--b-light); border-color: var(--b-light); }
  .btn-light-outline:hover { background: var(--b-light); color: #000; }

  /* ── Etiquetas ── */
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag-time { background: var(--t-time-bg); color: var(--t-time); }
  .tag-cons { background: var(--t-cons-bg); color: var(--t-cons); }
  .tag-spec { background: var(--t-spec-bg); color: var(--t-spec); }
  .tag-recv { background: var(--t-deliv); color: var(--t-deliv-ink); }
  .tag-sent { background: var(--surface); color: var(--t-deliv); border: 1.5px dashed var(--t-deliv); padding: 1px 8px; }
  .tag-add { background: var(--ok-soft); color: var(--ok); }
  .tag-del { background: var(--err-soft); color: var(--err); text-decoration: line-through; }
  .chip-ok { background: var(--ok-soft); color: var(--ok); }
  .chip-warn { background: var(--warn-soft); color: var(--warn); }
  .chip-err { background: var(--err-soft); color: var(--err); }
  .chip-brand { background: var(--brand-soft); color: var(--brand-soft-ink); }
  .chip-muted { background: var(--surface2); color: var(--muted); }
  .room { display: inline-block; min-width: 40px; text-align: center; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 700 12.5px var(--mono); }

  /* ── Banner de demo ── */
  .demo-bar { position: sticky; top: 0; z-index: 45; min-height: var(--bar-h); box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; text-align: center; }
  .demo-bar button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 700; padding: 0; }

  /* ── Login ── */
  .login { min-height: calc(100vh - var(--bar-h)); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .login-hero { background: var(--brand); color: #fff; padding: 56px max(24px, env(safe-area-inset-left, 0px)) 56px clamp(24px, 6vw, 72px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .login-hero .logo { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .login-hero .logo::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .login-hero h1 { font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; letter-spacing: -.6px; max-width: 520px; }
  .login-hero p { max-width: 500px; font-size: 15.5px; margin: 0; }
  .login-hero ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
  .login-pick { padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px clamp(16px, 5vw, 56px); display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .login-pick h2 { font-size: 22px; }
  .login-pick > p { color: var(--muted); margin: 0; }
  .who { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .who button { text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
  .who button:hover { border-color: var(--brand); box-shadow: var(--shadow); }
  .who .av { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
  .who b { display: block; font-size: 14.5px; }
  .who small { color: var(--muted); font-size: 12.5px; }
  .tip { border-left: 4px solid var(--brand); background: var(--brand-soft); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; }

  /* ── App ── */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--bar-h)); }
  .side { background: var(--brand); color: #fff; display: flex; flex-direction: column; position: sticky; top: var(--bar-h); height: calc(100vh - var(--bar-h)); height: calc(100dvh - var(--bar-h)); }
  .side-logo { padding: 14px 18px 10px; border-bottom: 1px solid var(--brand-hover); }
  .side-logo b { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; }
  .side-logo b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .side-logo small { display: block; font-size: 11.5px; margin-top: 3px; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
  .nav-sec { padding: 9px 10px 3px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
  .nav-sec:first-child { padding-top: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--brand-hover); }
  .nav a[aria-current="page"] { background: #E8E5FB; color: #4A3BB0; font-weight: 700; }
  .nav svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav .count { margin-left: auto; background: var(--b-warning); color: #000; border-radius: 999px; font-size: 11px; font-weight: 800; padding: 0 7px; }
  .side-foot { padding: 8px 10px 10px; border-top: 1px solid var(--brand-hover); display: grid; gap: 6px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
  .me .av { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
  .me b { display: block; font-size: 13.5px; } .me small { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .side-foot .btn { width: 100%; padding-block: 5px; }
  .nav-off { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; color: #fff; opacity: .6; cursor: not-allowed; font-weight: 500; }
  .nav-off .count { background: transparent; border: 1px solid currentColor; color: #fff; }
  .plan { display: grid; gap: 1px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.12); color: #fff; }
  .plan b { font-size: 13px; } .plan small { font-size: 11.5px; }
  .plan-hero { padding: 12px 14px; max-width: 460px; }

  .topbar { display: none; }
  .work { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .work-in { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; }
  .head p { margin: 2px 0 0; color: var(--muted); }
  .head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .head .actions .input { width: auto; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .card-pad { padding: 16px 18px; }
  .card h2 { font-size: 16px; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi { padding: 14px 16px; }
  .kpi span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  .kpi b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--muted); font-size: 12.5px; }
  .k-brand b { color: var(--brand-text); } .k-err b { color: var(--err); } .k-warn b { color: var(--warn); } .k-ok b { color: var(--ok); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--brand-soft); color: var(--brand-soft-ink); border-color: var(--brand-soft); }
  .tab .n { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--b-warning); color: #000; font-size: 11px; font-weight: 800; }
  .field { display: grid; gap: 4px; }
  .field label, .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .input, select.input, textarea.input { width: 100%; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search { min-width: 220px; max-width: 320px; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }

  .twrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); background: var(--surface2); padding: 10px 12px; white-space: nowrap; }
  td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  tr.pending td { background: var(--warn-soft); }
  tr.pending td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
  td.actions { white-space: nowrap; }
  .acts { display: grid; grid-template-columns: repeat(2, auto); gap: 4px; justify-content: start; }
  .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .diffbox { border: 2px dashed var(--warn); border-radius: 8px; padding: 4px; }

  .panel { border: 1px solid var(--line); border-left: 5px solid var(--brand); background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  .panel h3 { font-size: 14.5px; color: var(--brand-soft-ink); display: flex; align-items: center; gap: 8px; }
  .panel-list { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
  .panel-item { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .panel-item .grow { flex: 1 1 90px; min-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .panel-item .small, .panel-item .tag { white-space: nowrap; flex-shrink: 0; }

  .dispatchbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface2); }
  .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .check input { width: 17px; height: 17px; accent-color: var(--b-primary); }

  /* Formularios: selección de etiquetas */
  .picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1.5px solid var(--line); border-radius: 10px; }
  .picker:focus-within { border-color: var(--t-cons); box-shadow: 0 0 0 3px var(--t-cons-bg); }
  .pick { border: 1px solid var(--line); background: var(--surface2); color: var(--muted); border-radius: 20px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .pick[aria-pressed="true"].p-time { background: var(--c-time); color: var(--c-time-ink); border-color: var(--c-time); }
  .pick[aria-pressed="true"].p-cons { background: var(--c-cons); color: var(--c-ink); border-color: var(--c-cons); }
  .pick[aria-pressed="true"].p-spec { background: var(--c-spec); color: var(--c-ink); border-color: var(--c-spec); }
  .pick[aria-pressed="true"]::after { content: " ×"; }
  .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid .full { grid-column: 1 / -1; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); border-radius: 16px; width: min(640px, 100%); max-height: 92vh; overflow-y: auto; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .modal-h h2 { font-size: 17px; }
  .x { width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--surface2); cursor: pointer; font-size: 18px; }
  .modal-b { padding: 18px 22px; display: grid; gap: 14px; }
  .modal-f { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
  .box { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
  .box ul { margin: 6px 0 0; padding-left: 18px; }
  .box-warn { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
  .box-ok { background: var(--ok-soft); color: var(--ink); border-left: 4px solid var(--ok); }
  .box-info { background: var(--brand-soft); color: var(--ink); border-left: 4px solid var(--brand); }
  .err-msg { color: var(--err); font-size: 12.5px; font-weight: 600; }

  /* Historial */
  .timeline { display: grid; gap: 12px; }
  .ver { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .ver-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ver-h b { font-size: 15px; }
  .ver dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13.5px; }
  .ver dt { color: var(--muted); font-weight: 600; }
  .ver dd { margin: 0; }

  /* Reporte */
  .chart-wrap { overflow-x: auto; }
  .chart { width: 100%; min-width: 560px; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 11px var(--font); }
  .chart .grid { stroke: var(--line); }
  .chart rect.seg:hover { opacity: .8; }
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 13px; }
  .bar-track { height: 10px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }

  /* Empresa activa */
  .cobar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  .cobar b { color: var(--brand-text); }

    if (closeDate === date) {

      '<div class="twrap"><table class="t-cards"><thead><tr><th><input type="checkbox" data-a="selAll" aria-label="Seleccionar todas" style="width:18px;height:18px;accent-color:var(--b-primary)"></th><th>Estado</th><th>Hab.</th><th>Paciente</th><th>Tiempo</th><th>Consistencia</th><th>Especificaciones</th><th>Observaciones</th><th>Aislam.</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function diffCell(before, after, labels, cls) {
    var added = after.filter(function (k) { return before.indexOf(k) < 0; }), removed = before.filter(function (k) { return after.indexOf(k) < 0; });
    var html = '<div class="tags">' + after.map(function (k) { return added.indexOf(k) >= 0 ? '<span class="tag tag-add">+ ' + esc(labels[k] || k) + '</span>' : '<span class="tag ' + cls + '">' + esc(labels[k] || k) + '</span>'; }).join('') +
      removed.map(function (k) { return '<span class="tag tag-del">' + esc(labels[k] || k) + '</span>'; }).join('') + '</div>';
    if (!after.length && !removed.length) html = '<span class="muted">—</span>';
    return (added.length || removed.length) ? '<div class="diffbox">' + html + '</div>' : html;
  }

  // ── Despachos del día ──
  function vDespachos() {
    var T = today(), rows = [];
    D().forEach(function (d) { d.dispatches.forEach(function (x) { if (x.date === T) rows.push({ d: d, x: x }); }); });
    var summary = ['desayuno', 'mediamanana', 'almuerzo', 'algo', 'merienda', 'cena', 'fraccionada'].map(function (m) {
      var r = rows.filter(function (it) { return it.x.meal === m; }), ok = r.filter(function (it) { return it.x.receivedAt; }).length;
      var prog = D().filter(function (d) { return (d.status === 'active' || transferToday(d)) && cur(d).time.indexOf(m) >= 0; }).length;
      return '<div class="card card-pad" style="display:grid;gap:6px"><span class="lbl">' + MEAL_LABEL[m] + (SCHEDULE[m] ? ' · ' + SCHEDULE[m] : '') + '</span><b class="num" style="font-size:20px">' + r.length + ' <span class="small muted" style="font-weight:500">de ' + prog + ' despachados</span></b><span class="small" style="color:var(--t-deliv);font-weight:700">' + ok + ' recibidos</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + (prog ? Math.round(ok / prog * 100) : 0) + '%;background:var(--t-deliv)"></div></div></div>';
    }).join('');
    D().forEach(function (d) { (d.voided || []).forEach(function (x) { if (x.date === T) rows.push({ d: d, x: x }); }); });
    if (ui.dlService) rows = rows.filter(function (it) { return it.x.meal === ui.dlService; });
    if (ui.dlState) rows = rows.filter(function (it) { return ui.dlState === 'voided' ? it.x.voidedAt : !it.x.voidedAt && (ui.dlState === 'received' ? it.x.receivedAt : !it.x.receivedAt); });
    rows.sort(function (a, b) { return roomSort(a.d, b.d) || MEALS.indexOf(a.x.meal) - MEALS.indexOf(b.x.meal); });
    var body = rows.map(function (it) {
      return '<tr><td><span class="room">' + esc(it.d.room) + '</span></td><td>' + esc(it.d.patient) + '</td><td><span class="tag tag-time">' + MEAL_LABEL[it.x.meal] + '</span></td><td class="num">' + fmtTime(it.x.at) + '<div class="small muted">' + esc(it.x.by) + '</div></td><td>' + (it.x.voidedAt ? '<span class="tag chip-err">' + (it.x.voidKind === 'missing' ? '✗ No llegó' : '✗ Anulado por cocina') + ' ' + fmtTime(it.x.voidedAt) + '</span><div class="small muted">' + esc(it.x.voidedBy) + (it.x.voidReason ? ' · ' + esc(it.x.voidReason) : '') + '</div>' : it.x.receivedAt ? '<span class="tag tag-recv">✓ Recibido ' + fmtTime(it.x.receivedAt) + '</span><div class="small muted">' + esc(it.x.receivedBy) + '</div>' : '<span class="tag tag-sent">🚚 Sin recibir</span>') + '</td></tr>';
    }).join('') || '<tr><td colspan="5" class="empty">No hay despachos con estos filtros.</td></tr>';
    return '<div class="head"><div><h1>Despachos del día</h1><p>Lo que salió de cocina hoy y lo que ya recibió nutrición.</p></div></div>' +
      '<div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">' + summary + '</div>' +
      '<div class="card"><div class="toolbar"><div class="tabs"><select class="input" data-a="dlService" aria-label="Servicio"><option value="">Todos los servicios</option>' + MEALS.map(function (m) { return '<option value="' + m + '"' + (ui.dlService === m ? ' selected' : '') + '>' + MEAL_LABEL[m] + '</option>'; }).join('') + '</select>' +
      '<select class="input" data-a="dlState" aria-label="Estado"><option value="">Todos los estados</option><option value="pending"' + (ui.dlState === 'pending' ? ' selected' : '') + '>Sin recibir</option><option value="received"' + (ui.dlState === 'received' ? ' selected' : '') + '>Recibidos</option><option value="voided"' + (ui.dlState === 'voided' ? ' selected' : '') + '>Anulados o no llegaron</option></select></div><span class="small muted">' + fmtDate(T) + '</span></div>' +
      '<div class="twrap"><table class="t-cards"><thead><tr><th>Hab.</th><th>Paciente</th><th>Tiempo</th><th>Despachado</th><th>Recepción</th></tr></thead><tbody>' + body + '</tbody></table></div></div>';
  }

  // ── Historial ──
  function vHistorial() {
    var all = D().slice().sort(roomSort);
    if (!ui.histId || !byId(ui.histId)) ui.histId = all[0] && all[0].id;
    var d = byId(ui.histId);
    if (!d) return '<div class="head"><div><h1>Historial de cambios</h1><p>Cada versión de la dieta: quién la cambió, cuándo y qué cambió.</p></div></div><div class="card"><p class="empty">Todavía no hay dietas.</p></div>';
    var opts = all.map(function (x) { return '<option value="' + x.id + '"' + (x.id === d.id ? ' selected' : '') + '>Hab. ' + esc(x.room) + ' · ' + esc(x.patient) + (x.status !== 'active' ? ' (' + (x.status === 'cancelled' ? 'cancelada' : 'alta') + ')' : '') + '</option>'; }).join('');
    var vers = d.versions.slice().reverse().map(function (v, i, arr) {
      var prev = arr[i + 1];
      var cls = v.change === 'creada' ? 'chip-brand' : v.change === 'editada' ? 'chip-warn' : v.change === 'cancelada' ? 'chip-err' : v.change === 'finalizada' ? 'chip-err' : 'chip-ok';
      var dl = '<dl>' + histRow('Tiempos', v.time, prev && prev.time, MEAL_LABEL, 'tag-time') + histRow('Consistencia', v.cons, prev && prev.cons, CONS, 'tag-cons') + histRow('Especificaciones', v.spec, prev && prev.spec, SPEC, 'tag-spec') +
        histSimple('Aislamiento', v.iso, prev && prev.iso) + histSimple('Observaciones', v.obs || '—', prev && (prev.obs || '—')) + histSimple('Tipo de facturación', BILLING[v.billing][0], prev && BILLING[prev.billing][0]) + '</dl>';
      return '<div class="ver"><div class="ver-h"><b>Versión ' + v.v + '</b><span class="tag ' + cls + '">' + CHANGE[v.change] + '</span>' + (v.pending ? '<span class="tag chip-warn">Sin confirmar en cocina</span>' : '') + '<span class="small muted" style="margin-left:auto">' + fmtDateTime(v.at) + ' · ' + esc(v.by) + '</span></div>' + dl + '</div>';
    }).join('');
    return '<div class="head"><div><h1>Historial de cambios</h1><p>Cada versión de la dieta: quién la cambió, cuándo y qué cambió.</p></div></div>' +
      '<div class="card card-pad" style="display:grid;gap:14px"><div class="field" style="max-width:460px"><label for="hsel">Dieta</label><select class="input" id="hsel" data-a="histSel">' + opts + '</select></div>' +
      '<div class="legend"><span class="tag tag-add">+ Agregado</span><span class="tag tag-del">Quitado</span><span class="tag tag-time">Se mantiene</span></div><div class="timeline">' + vers + '</div></div>';
  }
  function histRow(label, now, before, labels, cls) {
    var body;
    if (!before) body = tagsHtml(now, cls, labels);
    else {
      var added = now.filter(function (k) { return before.indexOf(k) < 0; }), removed = before.filter(function (k) { return now.indexOf(k) < 0; });
      body = '<div class="tags">' + now.map(function (k) { return '<span class="tag ' + (added.indexOf(k) >= 0 ? 'tag-add">+ ' : cls + '">') + esc(labels[k]) + '</span>'; }).join('') + removed.map(function (k) { return '<span class="tag tag-del">' + esc(labels[k]) + '</span>'; }).join('') + '</div>';
      if (!now.length && !removed.length) body = '<span class="muted">—</span>';
    }
    return '<dt>' + label + '</dt><dd>' + body + '</dd>';
  }
  function histSimple(label, now, before) {
    return '<dt>' + label + '</dt><dd>' + esc(now) + (before != null && before !== now ? ' <span class="small" style="color:var(--err);text-decoration:line-through">' + esc(before) + '</span>' : '') + '</dd>';
  }

  // ── Reporte nutricional ──
  function monthOptions() {
    var out = [], d = new Date();
    for (var i = 0; i < 6; i++) { var m = new Date(d.getFullYear(), d.getMonth() - i, 1); var k = m.getFullYear() + '-' + pad(m.getMonth() + 1); out.push('<option value="' + k + '"' + (k === ui.month ? ' selected' : '') + '>' + m.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' }) + '</option>'); }
    return out.join('');
  }
  function vReporte() {
    var days = monthDays(ui.month), perDay = days.map(function (k) {
      var c = {}; MEALS.forEach(function (m) { c[m] = 0; });
      D().forEach(function (d) { mealsCounted(d, k).forEach(function (x) { c[x.meal]++; }); });
      return { day: k, c: c, total: MEALS.reduce(function (s, m) { return s + c[m]; }, 0) };
    });
    var totals = {}; MEALS.forEach(function (m) { totals[m] = perDay.reduce(function (s, p) { return s + p.c[m]; }, 0); });
    var trays = MEALS.reduce(function (s, m) { return s + totals[m]; }, 0);
    var patients = D().filter(function (d) { return days.some(function (k) { return mealsCounted(d, k).length; }); }).length;
    var dietDays = 0; days.forEach(function (k) { D().forEach(function (d) { if (mealsCounted(d, k).length) dietDays++; }); });
    var kp = '<div class="kpis">' + kpi('Bandejas del mes', trays.toLocaleString('es-CO'), 'Suma de todos los tiempos de comida', 'k-brand') +
      kpi('Promedio diario', days.length ? (dietDays / days.length).toFixed(1).replace('.', ',') : '0', 'Dietas vigentes por día', 'k-brand') +
      kpi('Pacientes en el mes', patients, 'Con al menos un día de dieta', 'k-brand') +
      kpi('Dietas activas hoy', activeDiets().length, activeDiets().filter(function (d) { return cur(d).iso === 'Sí'; }).length + ' en aislamiento', 'k-brand') + '</div>';
    // Gráfica de barras apiladas (SVG)
    var W = 760, H = 300, L = 40, R = 10, Tp = 14, B = 34, max = Math.max(1, Math.max.apply(null, perDay.map(function (p) { return p.total; })));
    var step = max <= 10 ? 2 : max <= 50 ? 10 : max <= 100 ? 20 : 50, top = Math.ceil(max / step) * step;
    var bw = days.length ? (W - L - R) / days.length : 0, svg = '';
    for (var t = 0; t <= top; t += step) { var y = Tp + (H - Tp - B) * (1 - t / top); svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + t + '</text>'; }
    perDay.forEach(function (p, i) {
      var x = L + i * bw + bw * 0.18, w = Math.max(2, bw * 0.64), yb = H - B;
      MEALS.forEach(function (m) {
        var v = p.c[m]; if (!v) return;
        var h = (H - Tp - B) * v / top;
        svg += '<rect class="seg" x="' + x.toFixed(1) + '" y="' + (yb - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0, h - 1.5).toFixed(1) + '" rx="1.5" fill="' + MEAL_COLOR[m] + '"><title>' + fmtDate(p.day) + ' · ' + MEAL_LABEL[m] + ': ' + v + '</title></rect>';
        yb -= h;
      });
      if (days.length <= 16 || i % 2 === 0) svg += '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + p.day.slice(8) + '</text>';
    });
    var leg = '<div class="legend" style="margin-top:8px">' + MEALS.map(function (m) { return '<span><span class="dot" style="background:' + MEAL_COLOR[m] + '"></span> ' + MEAL_LABEL[m] + '</span>'; }).join('') + '</div>';
    var bars = MEALS.map(function (m) { var pct = trays ? totals[m] / trays * 100 : 0; return '<div class="bar-row"><span>' + MEAL_LABEL[m] + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%;background:' + MEAL_COLOR[m] + '"></div></div><span class="num small" style="text-align:right">' + totals[m] + ' (' + Math.round(pct) + '%)</span></div>'; }).join('');
    var table = '<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Ver tabla diaria</summary><div class="twrap" style="margin-top:8px"><table><thead><tr><th>Día</th>' + MEALS.map(function (m) { return '<th>' + MEAL_LABEL[m] + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>' +
      perDay.map(function (p) { return '<tr><td>' + fmtDate(p.day) + '</td>' + MEALS.map(function (m) { return '<td class="num">' + p.c[m] + '</td>'; }).join('') + '<td class="num"><b>' + p.total + '</b></td></tr>'; }).join('') + '</tbody></table></div></details>';
    return '<div class="head"><div><h1>Reporte nutricional de dietas</h1><p>' + days.length + ' día(s) contados. Cada dieta usa su última versión del día; el día del alta solo cuentan los tiempos anteriores a la hora del alta.</p></div><div class="actions"><select class="input" data-a="month" aria-label="Mes">' + monthOptions() + '</select><button type="button" class="btn btn-primary" data-a="excel">Descargar Excel del mes</button></div></div>' + kp +
      '<div class="grid2"><div class="card card-pad"><h2>Producción diaria</h2><p class="sub">Bandejas por día y tiempo de comida</p><div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Bandejas por día del mes, apiladas por tiempo de comida">' + svg + '</svg></div>' + leg + table + '</div>' +
      '<div class="card card-pad"><h2>Total del mes por tiempo de comida</h2><p class="sub">Participación de cada tiempo</p><div class="bars" style="margin-top:14px">' + bars + '</div><div style="display:flex;justify-content:space-between;margin-top:16px;padding:12px 14px;background:var(--surface2);border-radius:10px"><span>Total bandejas</span><b class="num">' + trays.toLocaleString('es-CO') + '</b></div></div></div>';
  }

  // ── Facturación y precios ──
  function vFacturacion() {
    var days = monthDays(ui.month), sum = {};
    days.forEach(function (k) {
      D().forEach(function (d) {
        mealsCounted(d, k).forEach(function (x) {
          if (x.meal === 'fraccionada') return; // la fraccionada no se factura
          var type = BILLING[x.billing][1].indexOf(x.meal) >= 0 ? x.billing : (SNACKS.indexOf(x.meal) >= 0 ? 'entrecomidas' : x.billing);
          sum[type] = sum[type] || {}; sum[type][x.meal] = (sum[type][x.meal] || 0) + 1;
        });
      });
    });
    var svcs = ['desayuno', 'mediamanana', 'almuerzo', 'algo', 'cena', 'merienda'], grand = 0, units = 0;
    var rows = Object.keys(BILLING).filter(function (t) { return sum[t]; }).map(function (t) {
      var val = 0, u = 0;
      var cells = svcs.map(function (s) { var n = (sum[t][s] || 0); u += n; val += n * ((S.prices[t] || {})[s] || 0); return '<td class="num">' + (n || '<span class="muted">—</span>') + '</td>'; }).join('');
      grand += val; units += u;
      return '<tr><td><b>' + BILLING[t][0] + '</b></td>' + cells + '<td class="num"><b>' + u + '</b></td><td class="num"><b>' + money(val) + '</b></td></tr>';
    }).join('') || '<tr><td colspan="9" class="empty">No hay servicios para facturar este mes.</td></tr>';
    var priceRows = Object.keys(BILLING).map(function (t) {
      return '<tr><td>' + BILLING[t][0] + '</td>' + svcs.map(function (s) { return '<td>' + (BILLING[t][1].indexOf(s) >= 0 ? '<input class="price" type="number" min="0" step="100" value="' + S.prices[t][s] + '" data-a="price" data-t="' + t + '" data-s="' + s + '" aria-label="Precio ' + BILLING[t][0] + ' ' + SERVICE_LABEL[s] + '">' : '<span class="muted">—</span>') + '</td>'; }).join('') + '</tr>';
    }).join('');
    return '<div class="head"><div><h1>Facturación y precios</h1><p>Valor del mes por tipo de dieta y servicio. Fraccionada no se factura; los refrigerios sin fila propia van a Entrecomidas.</p></div><div class="actions"><select class="input" data-a="month" aria-label="Mes">' + monthOptions() + '</select><button type="button" class="btn btn-success" data-a="excel">Descargar Excel de facturación</button></div></div>' +
      '<div class="kpis">' + kpi('Total del mes', money(grand), 'Servicios valorados con su precio', 'k-ok') + kpi('Servicios', units.toLocaleString('es-CO'), 'Sin fraccionada', 'k-brand') + kpi('Tipos de dieta', Object.keys(sum).length, 'Con consumo en el mes', 'k-brand') + kpi('Unidad', 'UCI', 'Formato del hospital', 'k-brand') + '</div>' +
      '<div class="box box-info">En la demo se valora lo <b>programado</b>. En la aplicación real solo se factura lo <b>recibido</b> en días completados.</div>' +
      '<div class="card"><div class="toolbar"><h2>Resumen del mes</h2></div><div class="twrap"><table><thead><tr><th>Tipo de dieta</th>' + svcs.map(function (s) { return '<th>' + SERVICE_LABEL[s] + '</th>'; }).join('') + '<th>Total</th><th>Valor</th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td><b>Total</b></td><td colspan="6"></td><td class="num"><b>' + units + '</b></td><td class="num"><b>' + money(grand) + '</b></td></tr></tfoot></table></div></div>' +
      '<div class="card"><div class="toolbar"><div><h2>Precios vigentes</h2><p class="sub">Edita un precio y el total del mes se recalcula.</p></div></div><div class="twrap"><table><thead><tr><th>Tipo</th>' + svcs.map(function (s) { return '<th>' + SERVICE_LABEL[s] + '</th>'; }).join('') + '</tr></thead><tbody>' + priceRows + '</tbody></table></div></div>';
  }

  function openCompany(c) {

    var mgrs = S.users.filter(function (u) { return u.role === 'jefe_despacho' && u.active; });

      '<div class="field"><label for="co-contact">Contacto</label><input class="input" id="co-contact" value="' + esc(v.contact) + '" placeholder="Nombre del contacto"></div>' +

      '<div class="field"><label for="co-email">Correo</label><input class="input" id="co-email" type="email" value="' + esc(v.email) + '" placeholder="contacto@empresa.co"></div>' +

  // ════════════════ Acciones ════════════════
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.getElementById('toasts').appendChild(t); setTimeout(function () { t.remove(); }, 3800); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el) return;
    var a = el.dataset.a, d = el.dataset.id ? byId(el.dataset.id) : null;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return; // los maneja «change»
    switch (a) {
      case 'login': user = S.users.find(function (u) { return u.id === el.dataset.id; }); try { sessionStorage.setItem(USER_KEY, user.id); sessionStorage.removeItem(CO_KEY); } catch (er) {} view = null; coId = null; ui.histId = null; resolveCo(); ui.sel = {}; ui.rsel = {}; audit('Inicio de sesión (' + ROLE[user.role] + ')'); render(); break;
      case 'logout': openLogout(); break;
      case 'doLogout': try { sessionStorage.removeItem(USER_KEY); } catch (er) {} user = null; closeModal(); render(); break;
      case 'reset': openReset(); break;
      case 'doReset': S = seed(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (er) {} if (user) user = S.users.find(function (u) { return u.id === user.id; }) || null; ui.sel = {}; ui.rsel = {}; closeModal(); render(); toast('Demo reiniciada con los datos de prueba'); break;

      case 'tab': ui.tab = el.dataset.k; render(); break;

      case 'close': openClose(d, el.dataset.kind); break;
      case 'hist': ui.histId = d.id; view = 'historial'; render(); window.scrollTo(0, 0); break;
      case 'overlay': if (e.target === el) closeModal(); break;

      case 'saveCreate': {
        var f = readForm();
        if (!f.room || !f.patient) return formError('Escribe la habitación y el nombre del paciente.');
        if (!f.time.length) return formError('Elige al menos un tiempo de comida.');
        if (!f.cons.length) return formError('Elige la consistencia.');
        if (activeDiets().some(function (x) { return x.room === f.room; })) return formError('La habitación ' + f.room + ' ya tiene una dieta activa. Edítala en lugar de registrar otra.');
        var nd = { id: S.nextId++, companyId: coId, room: f.room, patient: f.patient, status: 'active', createdAt: isoNow(), closedAt: null, transfer: null, days: {}, dispatches: [], versions: [] };
        nd.versions.push({ v: 1, at: nd.createdAt, by: user.name, time: f.time, cons: f.cons, spec: f.spec, obs: f.obs, iso: f.iso, billing: f.billing, change: 'creada', pending: false });
        nd.days[today()] = { authorized: true, completedAt: null };

        break;
      }
      case 'saveEdit': {

        if (!g.cons.length) return formError('Elige la consistencia.');
        var same = JSON.stringify([g.time, g.cons, g.spec.slice().sort(), g.obs, g.iso, g.billing]) === JSON.stringify([c.time, c.cons, c.spec.slice().sort(), c.obs, c.iso, c.billing]);
        if (same) return formError('No hay cambios para guardar.');
        addVersion(d, { time: g.time, cons: g.cons, spec: g.spec, obs: g.obs, iso: g.iso, billing: g.billing }, 'editada', true);
        commit('Versión ' + cur(d).v + ' creada · cocina debe confirmarla', 'Editó la dieta de la habitación ' + d.room + ' (versión ' + cur(d).v + ')');

      case 'saveClose': {

          if (dest && dest.value.trim()) d.transfer = { dest: dest.value.trim(), meals: ms, date: today() };
        }
        addVersion(d, {}, kind === 'finish' ? 'finalizada' : 'cancelada', true);
        d.status = kind === 'finish' ? 'finished' : 'cancelled'; d.closedAt = isoNow();
        commit(kind === 'finish' ? 'Alta registrada · Hab. ' + d.room : 'Dieta cancelada · Hab. ' + d.room, (kind === 'finish' ? 'Dio de alta' : 'Canceló') + ' la dieta de la habitación ' + d.room);

        break;
      }
      case 'receive': {
        var keys = Object.keys(ui.rsel).filter(function (k) { return ui.rsel[k]; }), n = 0, touched = {};
        keys.forEach(function (k) { var p = k.split(':'), dd = byId(p[0]), x = dd && dd.dispatches[+p[1]]; if (x && !x.receivedAt) { x.receivedAt = isoNow(); x.receivedBy = user.name; n++; touched[dd.id] = x.date; } });
        Object.keys(touched).forEach(function (id) { evaluateDay(byId(id), touched[id]); });

      }
      case 'confirm': d.versions.forEach(function (v) { v.pending = false; }); commit('Cambios confirmados · Hab. ' + d.room, 'Confirmó los cambios de la habitación ' + d.room); break;
      case 'confirmAll': { var cnt = 0; D().forEach(function (x) { if (pendingOf(x)) { cnt++; x.versions.forEach(function (v) { v.pending = false; }); } }); commit(cnt + ' dietas confirmadas', 'Confirmó los cambios de ' + cnt + ' dieta(s)'); break; }
      case 'dispatch': {
        var svc = ui.service, ids = Object.keys(ui.sel).filter(function (k) { return ui.sel[k] && !blockReason(byId(k), svc); }), T = today();
        ids.forEach(function (id) { byId(id).dispatches.push({ date: T, meal: svc, at: isoNow(), by: user.name, receivedAt: null, receivedBy: null }); });
        ui.sel = {};
        commit(ids.length + ' dieta(s) despachadas · ' + MEAL_LABEL[svc], 'Despachó ' + MEAL_LABEL[svc] + ' a ' + ids.length + ' habitación(es)');
        break;
      }
      case 'toggleUser': {
        var u = S.users.find(function (x) { return x.id === el.dataset.id; });
        if (u.role === 'admin' && u.active && S.users.filter(function (x) { return x.role === 'admin' && x.active; }).length < 2) { toast('Debe quedar al menos un administrador activo.'); break; }
        u.active = !u.active;
        commit((u.active ? 'Usuario activado: ' : 'Usuario desactivado: ') + u.name, (u.active ? 'Activó' : 'Desactivó') + ' al usuario ' + u.email);
        break;
      }
      case 'excel': toast('En la demo no se descargan archivos. En la aplicación se genera reporte-nutricional_' + slug((coById(coId) || { name: '' }).name) + '_' + ui.month + '.xlsx'); break;
      case 'newCo': openCompany(null); break;
      case 'editCo': { var ec = managedCos().find(function (c) { return c.id === +el.dataset.co; }); if (ec) openCompany(ec); break; }
      case 'saveCo': {
        var co = el.dataset.co ? managedCos().find(function (c) { return c.id === +el.dataset.co; }) : null;
        var nm = document.getElementById('co-name').value.trim(), nt = document.getElementById('co-nit').value.replace(/[.\s]/g, ''), ph = document.getElementById('co-phone').value.trim(), em = document.getElementById('co-email').value.trim().toLowerCase();
        var mg = user.role === 'admin' ? document.getElementById('co-mgr').value : (co ? co.managerId : user.id);
        var others = S.companies.filter(function (c) { return c !== co; });
        if (!nm) return formError('Escribe el nombre de la empresa.');
        if (others.some(function (c) { return c.name.toLowerCase() === nm.toLowerCase(); })) return formError('Ya existe una empresa con ese nombre.');
        if (!validNit(nt)) return formError('NIT inválido: revisa el dígito de verificación (formato 900123456-8).');
        if (others.some(function (c) { return c.nit === nt; })) return formError('Ya existe una empresa con ese NIT.');
        if (ph && !/^\+[1-9]\d{7,14}$/.test(ph)) return formError('El teléfono va con indicativo, por ejemplo +573001234567.');
        if (em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return formError('Escribe un correo válido.');
        if (!mg) return formError('Elige el jefe de despacho de la empresa.');
        var data = { name: nm, nit: nt, contact: document.getElementById('co-contact').value.trim(), phone: ph, email: em, managerId: mg };
        if (co) Object.assign(co, data); else { co = Object.assign({ id: S.nextCompanyId++, active: true, isDefault: false }, data); S.companies.push(co); }
        giveCompany(mg, co.id);
        commit(el.dataset.co ? 'Empresa actualizada: ' + nm : 'Empresa creada: ' + nm, (el.dataset.co ? 'Editó' : 'Creó') + ' la empresa ' + nm + ' (NIT ' + nt + ')');
        break;
      }
      case 'toggleCo': {
        var tc = managedCos().find(function (c) { return c.id === +el.dataset.co; });
        if (!tc || tc.isDefault) { toast('La empresa predeterminada no se desactiva.'); break; }
        tc.active = !tc.active;
        commit((tc.active ? 'Empresa activada: ' : 'Empresa desactivada: ') + tc.name, (tc.active ? 'Activó' : 'Desactivó') + ' la empresa ' + tc.name);
        break;
      }
      case 'userCos': { var uu = visibleUsers().find(function (x) { return x.id === el.dataset.id; }); if (uu) openUserCos(uu); break; }
      case 'saveUserCos': {
        var tu = visibleUsers().find(function (x) { return x.id === el.dataset.id; }), sel = readCos('uc-cos');
        if (!tu) break;
        if (sel.all && tu.role === 'despachador') return formError('El despachador no puede tener «Todas»: elige sus empresas.');
        // El jefe de despacho solo cambia sus empresas: las demás del usuario se conservan
        var keep = user.role === 'admin' || tu.companies === 'all' ? [] : tu.companies.filter(function (id) { return !assignableCos().some(function (c) { return c.id === id; }); });
        var ids = uniq(keep.concat(sel.ids));
        if (!sel.all && !ids.length) return formError('Elige «Todas» o al menos una empresa.');
        tu.companies = sel.all ? 'all' : ids;
        commit('Empresas actualizadas: ' + tu.name, 'Cambió las empresas de ' + tu.email);
        break;
      }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, a = el.dataset && el.dataset.a; if (!a) return;
    if (a === 'sel') { ui.sel[el.dataset.id] = el.checked; render(); }
    else if (a === 'selAll') { D().forEach(function (d) { if ((d.status === 'active' || transferToday(d)) && !blockReason(d, ui.service)) ui.sel[d.id] = el.checked; }); render(); }
    else if (a === 'rsel') { ui.rsel[el.dataset.k] = el.checked; render(); }
    else if (a === 'service') { ui.service = el.value; ui.sel = {}; render(); }
    else if (a === 'showAll') { ui.showAll = el.checked; render(); }
    else if (a === 'histSel') { ui.histId = +el.value; render(); }
    else if (a === 'month') { ui.month = el.value; render(); }
    else if (a === 'dlService') { ui.dlService = el.value; render(); }
    else if (a === 'dlState') { ui.dlState = el.value; render(); }
    else if (a === 'price') { var v = Math.max(0, Math.round(+el.value || 0)); S.prices[el.dataset.t][el.dataset.s] = v; save('Cambió el precio de ' + BILLING[el.dataset.t][0] + ' · ' + SERVICE_LABEL[el.dataset.s] + ' a ' + money(v)); render(); toast('Precio actualizado'); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.dataset && e.target.dataset.a === 'search') {
      ui.q = e.target.value; var pos = e.target.selectionStart; render();
      var s = document.getElementById('q'); if (s) { s.focus(); s.setSelectionRange(pos, pos); }
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'coSwitch') {
      // Cambiar empresa: vuelve a la misma pantalla con los filtros limpios
      e.preventDefault();
      var nc = +document.getElementById('co-sel').value;
      if (!userCos(user).some(function (c) { return c.id === nc; })) return;
      coId = nc; try { sessionStorage.setItem(CO_KEY, coId); } catch (er) {}
      ui.q = ''; ui.tab = 'active'; ui.sel = {}; ui.rsel = {}; ui.histId = null; ui.dlService = ''; ui.dlState = '';
      render(); toast('Ahora trabajas en ' + coById(coId).name);
      return;
    }
    if (e.target.id !== 'newUser') return;
    e.preventDefault();
    var name = document.getElementById('nu-name').value.trim(), email = document.getElementById('nu-email').value.trim().toLowerCase(), role = document.getElementById('nu-role').value, err = document.getElementById('nu-err');
    var cs = readCos('nu-cos');
    var fail = !name ? 'Escribe el nombre.' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? 'Escribe un correo válido.' : S.users.some(function (u) { return u.email === email; }) ? 'Ya existe un usuario con ese correo.'
      : role === 'admin' ? '' : cs.all && role === 'despachador' ? 'El despachador no puede tener «Todas»: elige sus empresas.' : !cs.all && !cs.ids.length ? 'Elige «Todas» o al menos una empresa.' : '';
    if (fail) { err.textContent = fail; err.hidden = false; return; }
    S.users.push({ id: 'u' + Date.now(), name: name, email: email, role: role, active: true, companies: role === 'admin' || cs.all ? 'all' : cs.ids });
    commit('Usuario creado: ' + name, 'Creó al usuario ' + email + ' (' + ROLE[role] + ')');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (modalEl.innerHTML) closeModal(); else if (ui.menu) { ui.menu = false; render(); } }
    if (e.key === 'Tab' && modalEl.innerHTML) {
      var f = [].slice.call(modalEl.querySelectorAll('button, input, select, textarea')).filter(function (x) { return !x.disabled; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  // Tiempo real entre pestañas: otra pestaña guardó cambios → se recargan los datos y se avisa
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY || !e.newValue) return;
    try { S = JSON.parse(e.newValue); } catch (er) { return; }
    if (user) user = S.users.find(function (u) { return u.id === user.id && u.active; }) || null;
    if (!modalEl.innerHTML) render();
    var last = S.audit[0];
    if (user && last && last.who !== user.name && (!last.co || last.co === coId)) toast('Cambio en vivo: ' + last.who + ' · ' + last.what);
  });

  var h = (location.hash || '').slice(1);
  if (VIEWS[h]) view = h;
  render();
})();
</script>
